[tool.poetry]
name = "fmdf-api"
version = "0.1.0"
description = "Florida Multifamily Deal Finder — FastAPI backend"
authors = ["FMDF Team"]
readme = "README.md"
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
asyncpg = "^0.30.0"
supabase = "^2.9.0"
httpx = "^0.28.0"
python-multipart = "^0.0.20"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
inngest = "^0.4.0"
apscheduler = "^3.10.0"
tenacity = "^9.0.0"
shapely = "^2.0.0"
pyproj = "^3.7.0"
pandas = "^2.2.0"
numpy = "^2.1.0"
resend = "^2.5.0"
twilio = "^9.3.0"
redis = "^5.2.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
black = "^24.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
